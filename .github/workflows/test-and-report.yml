name: Run Tests and Publish Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true   # джоба может быть красной, но остальные запустятся

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests (always continue)
      id: run_tests
      run: |
        # Запускаем тесты, но не прерываем workflow при ошибке
        npm test -- --coverage || true

    - name: Upload test report artifact (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-report/
        if-no-files-found: warn

  parse-results:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    outputs:
      total_tests: ${{ steps.extract.outputs.total_tests }}
      passed: ${{ steps.extract.outputs.passed }}
      failed: ${{ steps.extract.outputs.failed }}
      success_rate: ${{ steps.extract.outputs.success_rate }}

    steps:
    - name: Download test results JSON
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: ./artifacts
      continue-on-error: true

    - name: Extract metrics
      id: extract
      run: |
        TOTAL=0
        PASSED=0
        FAILED=0
        RATE=0

        if [ -f ./artifacts/test-results.json ]; then
          TOTAL=$(jq '.numTotalTests // 0' ./artifacts/test-results.json)
          PASSED=$(jq '.numPassedTests // 0' ./artifacts/test-results.json)
          FAILED=$(jq '.numFailedTests // 0' ./artifacts/test-results.json)
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc)
          fi
        fi

        echo "total_tests=$TOTAL" >> $GITHUB_OUTPUT
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "success_rate=$RATE" >> $GITHUB_OUTPUT

  deploy-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для push в gh-pages

    steps:
    - name: Download test report
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: ./test-report

    - name: Prepare report folder
      run: |
        # Создаём папку для отчётов
        mkdir -p ./test-reports/${{ github.run_id }}
        if [ -d "./test-report" ] && [ "$(ls -A ./test-report)" ]; then
          cp -r ./test-report/* ./test-reports/${{ github.run_id }}/
        else
          echo "<html><body><h1>⚠️ Test Report Not Available</h1><p>Run ${{ github.run_id }}</p></body></html>" > ./test-reports/${{ github.run_id }}/index.html
        fi

        # Генерируем индексную страницу со ссылками на все отчёты
        echo '<html><body><h1>📊 Test Reports History</h1><ul>' > ./test-reports/index.html
        for dir in ./test-reports/*/; do
          if [ -d "$dir" ]; then
            dirname=$(basename "$dir")
            if [ -f "$dir/index.html" ]; then
              echo "<li><a href='$dirname/'>Report #$dirname</a></li>" >> ./test-reports/index.html
            fi
          fi
        done
        echo '</ul></body></html>' >> ./test-reports/index.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./test-reports
        publish_branch: gh-pages   # <--- изменено с main на gh-pages
        force_orphan: true         # создаёт чистую ветку gh-pages при первом запуске
        keep_files: false          # не сохранять старые файлы (лучше для чистоты)
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy test report for run ${{ github.run_id }}'

  send-notification:
    needs: [test, parse-results]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🧪 **Test Results**
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Status: ${{ needs.test.result == 'success' && '✅ Success' || '❌ Failed' }}
          
          📊 **Results:**
          ✅ Passed: ${{ needs.parse-results.outputs.passed || '0' }}
          ❌ Failed: ${{ needs.parse-results.outputs.failed || '0' }}
          📈 Total: ${{ needs.parse-results.outputs.total_tests || '0' }}
          🎯 Success Rate: ${{ needs.parse-results.outputs.success_rate || '0' }}%
          
          📎 Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}/
          
          ⏱️ Time: ${{ github.event.head_commit.timestamp }}
          🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}