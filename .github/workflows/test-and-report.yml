name: Run Tests and Publish Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true  
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests with coverage (always continue)
      id: run_tests
      run: |
        # Запускаем тесты, но НЕ прерываем workflow при ошибке
        npm test -- --coverage || true
        # Сохраняем код возврата для информации
        if [ $? -eq 0 ]; then
          echo "tests_success=true" >> $GITHUB_OUTPUT
        else
          echo "tests_success=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Upload test report artifact (always)
      if: always()  
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-report/
        if-no-files-found: warn  
    
    - name: Get test results (always)
      id: test-results
      if: always()
      run: |
        # Пытаемся получить результаты тестов
        TOTAL_TESTS=0
        PASSED=0
        FAILED=0
        SUCCESS_RATE=0
        
        # Если есть JSON-отчет Jest
        if [ -f test-results.json ]; then
          TOTAL_TESTS=$(jq '.numTotalTests // 0' test-results.json)
          PASSED=$(jq '.numPassedTests // 0' test-results.json)
          FAILED=$(jq '.numFailedTests // 0' test-results.json)
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            SUCCESS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL_TESTS" | bc)
          fi
        else
          # Если нет файла результатов, пробуем запустить jest в тихом режиме
          npm test -- --json --outputFile=test-results.json || true
          if [ -f test-results.json ]; then
            TOTAL_TESTS=$(jq '.numTotalTests // 0' test-results.json)
            PASSED=$(jq '.numPassedTests // 0' test-results.json)
            FAILED=$(jq '.numFailedTests // 0' test-results.json)
            if [ "$TOTAL_TESTS" -gt 0 ]; then
              SUCCESS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL_TESTS" | bc)
            fi
          fi
        fi
        
        echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
      continue-on-error: true

  deploy-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
    - name: Download test report (always)
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: ./test-report
        continue-on-error: true
    
    - name: Prepare for GitHub Pages (always)
      if: always()
      run: |
        mkdir -p ./public/${{ github.run_id }}
        # Копируем отчет, если он существует
        if [ -d "./test-report" ] && [ "$(ls -A ./test-report)" ]; then
          cp -r ./test-report/* ./public/${{ github.run_id }}/
          echo "Report copied successfully"
        else
          # Создаём заглушку, если отчета нет
          echo "<html><body><h1>⚠️ Test Report Not Available</h1><p>Tests failed to generate report for run ${{ github.run_id }}</p></body></html>" > ./public/${{ github.run_id }}/index.html
        fi
        
        # Создаём главную страницу со списком всех отчетов
        echo '<html><body><h1>📊 Test Reports History</h1><ul>' > ./public/index.html
        for dir in ./public/*/; do
          if [ -d "$dir" ]; then
            dirname=$(basename "$dir")
            # Проверяем, есть ли index.html внутри
            if [ -f "$dir/index.html" ]; then
              echo "<li><a href='$dirname/'>Report #$dirname</a></li>" >> ./public/index.html
            elif [ -f "$dir/test-report.html" ]; then
              echo "<li><a href='$dirname/test-report.html'>Report #$dirname</a></li>" >> ./public/index.html
            else
              echo "<li>Report #$dirname (no index)</li>" >> ./public/index.html
            fi
          fi
        done
        echo '</ul><p><small>Last updated: $(date)</small></p></body></html>' >> ./public/index.html
    
    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public   
        publish_branch: main    
        force_orphan: false
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy test report for run ${{ github.run_id }}'

  send-notification:
    needs: test
    if: always()   
    runs-on: ubuntu-latest
    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🧪 **Test Results**
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Status: ${{ needs.test.result == 'success' && '✅ Success' || '❌ Failed' }}
          
          📊 **Results:**
          ✅ Passed: ${{ needs.test-results.outputs.passed || '0' }}
          ❌ Failed: ${{ needs.test-results.outputs.failed || '0' }}
          📈 Total: ${{ needs.test-results.outputs.total_tests || '0' }}
          🎯 Success Rate: ${{ needs.test-results.outputs.success_rate || '0' }}%
          
          📎 Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}/
          
          ⏱️ Time: ${{ github.event.head_commit.timestamp }}
          🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}